wiz.mcp.desc: "Register Bint's MCP server (Context Engine) so agents can query project knowledge: .mcp.json (Claude Code), .codex/config.toml (Codex)."
wiz.agents.desc: "Write the bint block (approved rules) into AGENTS.md and import it from CLAUDE.md. Off by default because no rule has been approved yet."
wiz.skills.desc: "Publish the core skills (b-bootstrap, b-do…) for the chosen harnesses: .claude/skills, .agents/skills."
wiz.git.desc: "Where do Bint's files live in Git?"
wiz.git.track: "track — committed for the whole team (default)"
wiz.git.local: "local — used on this machine only"
wiz.git.track.desc: "Configuration, skills and project-level hooks are committed for the whole team; only machine-specific files (.bint/local.yml…) go to .gitignore."
wiz.git.local.desc: "Untracked files (.bint/, skills, hooks, .mcp.json…) go to .git/info/exclude so git status stays clean; tracked files Bint edits (AGENTS.md…) get skip-worktree (a pull may complain if upstream changes them). Switch back later with bint init --git track."
