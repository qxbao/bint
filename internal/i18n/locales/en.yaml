transition.0: "types in require_human_approval_for (always includes rule), or third-party flagged items: a human approves (a)"
transition.1: "other types: pass the deterministic checks and do not conflict with a verified item (verify --apply), or a human approves"
transition.2: "origin: human: created verified straight away (the author is the reviewer); reviewed further through code review"
transition.3: "the evidence fingerprint changed (verify --apply)"
transition.4: "revalidation, rule/warning or needs a human: deterministic checks pass, then a human approves (f; the Revalidate tab lets an agent judge first)"
transition.5: "revalidation, other types: all deterministic checks (except fingerprint) pass → fingerprint is refreshed (verify --apply)"
transition.6: "a user (r or d), or an evolution proposal a human has applied"

