transition.0: "loại trong require_human_approval_for (luôn có rule), hoặc mục gắn cờ bên thứ ba: người duyệt (a)"
transition.1: "loại khác: qua kiểm tra xác định được và không mâu thuẫn với mục verified (verify --apply), hoặc người duyệt"
transition.2: "origin: human: được tạo ở verified ngay (tác giả là người duyệt); xem xét tiếp qua review mã"
transition.3: "fingerprint của bằng chứng thay đổi (verify --apply)"
transition.4: "xác thực lại, rule/warning hoặc cần người duyệt: kiểm tra xác định được qua, rồi người duyệt (f; thẻ Thẩm định lại cho agent nhận định trước)"
transition.5: "xác thực lại, loại khác: mọi kiểm tra xác định được (trừ fingerprint) qua → fingerprint được làm mới (verify --apply)"
transition.6: "người dùng (r hoặc d), hoặc đề xuất tiến hoá đã được người duyệt áp dụng"

