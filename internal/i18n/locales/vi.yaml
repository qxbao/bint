wiz.mcp.desc: "Đăng ký MCP server của Bint (Context Engine) để agent truy vấn tri thức của dự án: .mcp.json (Claude Code), .codex/config.toml (Codex)."
wiz.agents.desc: "Ghi khối bint (quy tắc đã duyệt) vào AGENTS.md và nhập lại trong CLAUDE.md. Mặc định tắt vì chưa có quy tắc nào được duyệt."
