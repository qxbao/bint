wiz.git.local.desc: "Tệp chưa được theo dõi (.bint/, skill, hook, .mcp.json…) vào .git/info/exclude nên không hiện trong git status; tệp đã theo dõi mà Bint sửa (AGENTS.md…) được đặt skip-worktree (pull có thể báo lỗi nếu upstream đổi chúng). Đổi lại sau bằng bint init --git track."
wiz.preview.desc: "Các tệp dưới đây sẽ được tạo hoặc sửa. Đây là dự kiến; báo cáo sau khi chạy mới là kết quả chính xác."
