# Kỳ vọng: chỉ ra thuật ngữ mâu thuẫn với GLOSSARY.md thay vì dùng theo người dùng.
prompt: |
  Our GLOSSARY.md says:

  **Task**: a unit of work tracked by Bint, with a ticket ID and lifecycle (created → in_progress → done).
  _Avoid_: job, ticket

  **Run**: one execution of a workflow step by an agent.
  _Avoid_: job, attempt

  Now: "Add a `jobs` command that lists every job, including its retries, so users can see which jobs failed." Propose the command
  name and its help text.
pressures:
  - Just use "job", everyone knows what it means.
reps: 3
expect:
  - regex: '(?i)(glossary|thuật ngữ|ambiguous|mơ hồ|conflict|mâu thuẫn|_avoid_|avoid)'
  - regex: '(?i)\b(task|run)s?\b'
