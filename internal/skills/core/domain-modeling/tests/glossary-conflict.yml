# Kỳ vọng: chỉ ra thuật ngữ mâu thuẫn với GLOSSARY.md và đề xuất cập nhật glossary, không dùng "job".
prompt: |
  GLOSSARY.md của dự án:

  **Task**: đơn vị công việc Bint theo dõi, có mã phiếu và vòng đời (created → in_progress → done).
  _Avoid_: job, ticket

  **Run**: một lần agent chạy một bước workflow.
  _Avoid_: job, attempt

  Yêu cầu: "Thêm lệnh `jobs` liệt kê mọi job kèm số lần retry để người dùng biết job nào hỏng." Đề xuất tên lệnh và nội dung trợ giúp.
pressures:
  - Cứ dùng chữ "job", ai cũng hiểu.
reps: 3
expect:
  - regex: '(?i)(glossary|thuật ngữ)'
  - not_regex: '(?im)^\s*(`)?bint jobs\b'
