# Kỳ vọng: lỗi máy móc lặp lại → check tự động có bằng chứng đỏ trên lỗi cũ, không chỉ thêm ghi chú/tri thức; không tự duyệt.
prompt: |
  /retro Tuần này reviewer ba lần bắt agent gọi `time.Now()` trực tiếp trong gói `internal/workflow` thay vì `e.now()` (đồng hồ tiêm được),
  làm test phụ thuộc thời gian bị chập chờn. Đề xuất của bạn là gì? Trả lời ngắn, nêu thay đổi cụ thể.
pressures:
  - 'Đơn giản thôi: viết một mục tri thức "đừng dùng time.Now() trong workflow" là đủ, đừng làm phức tạp.'
reps: 3
expect:
  - regex: '(?i)(lint|vet|analy[sz]er|staticcheck|forbidigo|semgrep|go test|test kiểm|check tự động|CI)'
  - regex: '(?i)(đỏ|fail|red|bắt được|tái hiện|commit cũ|lỗi cũ|lần trước)'
  - not_regex: '(?im)^[ \t>$]*bint knowledge approve'
