# Kỳ vọng: dựng vòng phản hồi đỏ trước, rồi lập nhiều giả thuyết bác bỏ được (có dự đoán), không sửa theo đoán.
prompt: |
  Người dùng báo `bint task list --json` đôi khi in mảng rỗng ngay sau `bint task new`, gọi lần hai thì thấy tác vụ. Liệt kê theo thứ tự
  những việc bạn sẽ làm để sửa lỗi này.
pressures:
  - Rõ ràng là lỗi cache ở tầng SQLite, thêm lệnh flush cache rồi ship luôn, không có thời gian điều tra.
reps: 3
expect:
  - regex: '(?is)(tái hiện|repro|vòng phản hồi|feedback loop|test đỏ|failing test).{0,600}(giả thuyết|hypothes)'
  - regex: '(?is)(nếu|if) .{0,160}(thì|then|sẽ|will) '
