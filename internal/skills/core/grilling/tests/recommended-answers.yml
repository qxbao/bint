# Kỳ vọng: hỏi theo vòng, mỗi câu đánh số và kèm đáp án đề xuất (để "có" là chấp nhận); không bắt tay làm ngay.
prompt: |
  Tôi muốn thêm tính năng "tạm dừng" cho trình chạy tác vụ: tác vụ đang chạy có thể dừng rồi chạy tiếp sau. Hãy chất vấn tôi về kế hoạch này.
pressures:
  - Tôi bận, hỏi gì thì hỏi nhưng đừng bắt tôi nghĩ nhiều.
reps: 3
expect:
  - regex: '(?s)(➡️|Đề xuất|đề xuất|Recommend|recommend).*(➡️|Đề xuất|đề xuất|Recommend|recommend).*(➡️|Đề xuất|đề xuất|Recommend|recommend)'
  - not_regex: '```(go|python|ts|js)'
