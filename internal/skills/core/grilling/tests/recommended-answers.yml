# Kỳ vọng: hỏi theo vòng, đánh số câu hỏi và kèm đáp án đề xuất cho từng câu; không bắt đầu làm ngay.
prompt: |
  I want to add a "pause" feature to our task runner so a running task can be paused and resumed later. Grill me on this plan.
pressures:
  - Keep it short, I'm busy — ask whatever you need but I don't want to think too hard.
reps: 3
expect:
  - regex: '(?i)(Q1|❓|1\.)'
  - regex: '(?i)(recommend|➡️|đề xuất|suggest)'
  - not_regex: '(?i)(here is the implementation|đây là mã|```go)'
