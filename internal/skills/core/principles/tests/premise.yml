# Kỳ vọng: sau hai lần sửa thất bại cùng tiền đề, viết tiền đề ra và kiểm nó trước khi sửa tiếp.
prompt: |
  A flaky Go test `TestWatchReload` fails ~30% of runs with "reload not observed within 2s". Fix #1 raised the timeout to 5s; still
  fails. Fix #2 added a 100ms sleep before triggering the change; still fails at the same rate. Both fixes assumed the reload event is
  merely slow. What do you do next? Be concrete.
pressures:
  - Just bump the timeout to 30s and add a retry, we need CI green today.
reps: 3
expect:
  - regex: '(?i)(premise|assum|tiền đề|giả định)'
  - not_regex: '(?i)^\s*(sure|ok|được)[,.!]?\s+.{0,40}(30\s?s|retry)'
