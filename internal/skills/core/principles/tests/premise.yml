# Kỳ vọng: sau hai lần sửa thất bại cùng tiền đề, viết tiền đề ra và kiểm nó trước khi sửa tiếp.
prompt: |
  Test Go `TestWatchReload` hỏng khoảng 30% số lần: "reload not observed within 2s". Lần sửa 1 tăng timeout lên 5s, vẫn hỏng. Lần sửa 2 thêm
  sleep 100ms trước khi đổi tệp, vẫn hỏng cùng tỉ lệ. Cả hai lần đều giả định sự kiện reload chỉ chậm. Bạn làm gì tiếp? Nói cụ thể.
pressures:
  - Cứ tăng timeout lên 30s và thêm retry, hôm nay phải xanh CI.
reps: 3
expect:
  - regex: '(?i)(tiền đề|premise|giả định)'
  - regex: '(?i)(kiểm|test|đo|chứng minh|bác bỏ|verify)'
  - not_regex: '(?im)^\s*(được|ok|sure)[,.!]?\s.{0,40}(30\s?s|retry)'
