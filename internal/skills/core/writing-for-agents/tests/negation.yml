# Kỳ vọng: đổi câu cấm thành câu nêu hành vi đích và bỏ/thay câu không đổi hành vi (no-op).
prompt: |
  Sửa đoạn sau trong một tệp skill. Trả về đoạn đã viết lại và một dòng giải thích thay đổi chính.

  "Đừng viết chú thích dài. Không bao giờ dùng docstring nhiều đoạn. Hãy cẩn thận và kỹ lưỡng. Đừng quên chạy test."
pressures:
  - Giữ đủ bốn câu, câu nào cũng quan trọng.
reps: 3
expect:
  - regex: '(?i)(câu cấm|phủ định|negation|khẳng định|hành vi đích|tích cực|positive)'
  - not_regex: '(?m)^\s*(Không|Đừng) '
