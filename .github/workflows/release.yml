# CD của Bint — BẢN NHÁP, CHƯA KÍCH HOẠT.
#
# Workflow này KHÔNG tự chạy: chỉ có trigger workflow_dispatch (bấm tay), và mọi job
# đều bị bỏ qua cho tới khi biến repository BINT_CD_ENABLED được đặt thành "true".
# Kể cả khi đã bật, mặc định dry_run=true (chỉ build, không tạo release) và job
# publish cần environment "release" (người duyệt) rồi chỉ tạo release ở trạng thái draft.
#
# Hướng dẫn kích hoạt: docs/ci-cd.md, mục "Kích hoạt CD".
name: Release (draft, disabled)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag đã tồn tại, dạng vX.Y.Z hoặc vX.Y.Z-rc.N (vd v0.1.0)"
        required: true
        type: string
      dry_run:
        description: "Chỉ build và kiểm tra, không tạo GitHub Release"
        required: true
        type: boolean
        default: true

# Mặc định không cấp quyền gì; từng job tự xin quyền tối thiểu.
permissions: {}

# Không bao giờ chạy song song hai lần release.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  guard:
    name: Kiểm tra điều kiện
    # Cổng khoá chính: biến repository chưa được đặt => toàn bộ workflow bị bỏ qua.
    # Chỉ chạy khi dispatch từ main, để mã workflow được dùng là mã đã review.
    if: ${{ vars.BINT_CD_ENABLED == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Kiểm tra tag
        id: check
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$TAG' không đúng dạng vX.Y.Z[-pre]"
            exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            echo "::error::Tag '$TAG' chưa tồn tại; tạo và push tag trước (xem docs/ci-cd.md)"
            exit 1
          fi
          if ! git merge-base --is-ancestor "refs/tags/$TAG" origin/main; then
            echo "::error::Tag '$TAG' không nằm trên lịch sử của main"
            exit 1
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

  build:
    name: Test và đóng gói
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.guard.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.guard.outputs.version }}
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Không dùng cache cho bản phát hành: build sạch, tránh cache bị đầu độc.
          cache: false

      - name: Test
        env:
          CGO_ENABLED: "1"
        run: |
          git config --global user.name "bint-release"
          git config --global user.email "bint-release@users.noreply.github.com"
          go test -race -count=1 -timeout 20m ./...

      # Cùng cờ build với job build trong ci.yml, chỉ khác chuỗi phiên bản.
      - name: Build và đóng gói
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            goos=${target%/*}
            goarch=${target#*/}
            name="bint_${VERSION#v}_${goos}_${goarch}"
            ext=""
            [ "$goos" = windows ] && ext=".exe"
            mkdir -p "build/$name"
            GOOS=$goos GOARCH=$goarch go build -trimpath \
              -ldflags "-s -w -X bint/internal/cli.Version=${VERSION}" \
              -o "build/$name/bint${ext}" ./cmd/bint
            cp README.md "build/$name/"
            if [ "$goos" = windows ]; then
              (cd build && zip -qr "../dist/$name.zip" "$name")
            else
              tar -C build -czf "dist/$name.tar.gz" "$name"
            fi
          done
          (cd dist && sha256sum * > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Kiểm tra phiên bản trong binary
        run: |
          tar -xzf "dist/bint_${VERSION#v}_linux_amd64.tar.gz" -C "$RUNNER_TEMP"
          out=$("$RUNNER_TEMP/bint_${VERSION#v}_linux_amd64/bint" --version)
          echo "$out"
          [[ "$out" == *"$VERSION"* ]]

      # Artifact của lần chạy workflow (không phải GitHub Release), tự xoá sau 7 ngày.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bint-${{ env.VERSION }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Tạo GitHub Release (draft)
    needs: [guard, build]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Environment có người duyệt bắt buộc: job dừng chờ phê duyệt trước khi chạy.
    environment: release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.guard.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bint-${{ env.VERSION }}
          path: dist

      # Chỉ tạo release ở trạng thái draft; người bảo trì kiểm tra rồi bấm Publish trên GitHub.
      - name: gh release create --draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          prerelease=""
          [[ "$VERSION" == *-* ]] && prerelease="--prerelease"
          gh release create "$VERSION" dist/* \
            --verify-tag --draft $prerelease \
            --title "Bint $VERSION" --generate-notes
